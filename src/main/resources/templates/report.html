<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀피셜 신고 접수 안내</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f6f8; font-family: Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f6f8; padding: 40px 0;">
    <tr>
        <td align="center">

            <!-- 메일 본문 컨테이너 -->
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:12px; overflow:hidden;">

                <!-- 헤더 -->
                <tr>
                    <td style="padding:32px 24px 16px 24px;">
                        <p style="font-size:20px; margin:0;">
                            안녕하세요 <strong>팀피셜</strong>입니다.
                        </p>
                    </td>
                </tr>

                <!-- 이미지 -->
                <tr>
                    <td align="center">
                        <img src="cid:report_email"
                             alt="신고 안내 이미지"
                             style="width:90%; max-width:350px; height:auto;">
                    </td>
                </tr>

                <!-- 안내 문구 -->
                <tr>
                    <td style="padding:24px;">
                        <p style="margin:0 0 16px 0; font-size:15px; line-height:1.6;">
                            아래 내용에 대한 신고가 정상적으로 접수되었습니다.<br>
                            운영팀에서 확인 후 조치하겠습니다.
                        </p>
                    </td>
                </tr>

                <!-- 신고 정보 박스 -->
                <tr>
                    <td style="padding:0 24px 24px 24px;">
                        <div style="background:#f2f4f7; padding:16px; border-radius:8px;">

                            <p style="margin:0 0 8px 0; font-size:14px;">
                                <strong>키워드</strong>
                            </p>
                            <p style="margin:0 0 16px 0; font-size:14px;"
                               th:text="${keyword}">
                            </p>

                            <p style="margin:0 0 8px 0; font-size:14px;">
                                <strong>신고된 문구</strong>
                            </p>
                            <p style="margin:0; font-size:14px; line-height:1.5;"
                               th:text="${commentContent}">
                            </p>

                        </div>
                    </td>
                </tr>

                <!-- 푸터 -->
                <tr>
                    <td style="padding:24px; font-size:12px; color:#999999; text-align:center;">
                        본 메일은 발신 전용 메일입니다.<br>
                        © Teamficial. All rights reserved.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
